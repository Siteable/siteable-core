  <!-- Theme CSS Custom Properties -->
  <style>

      --color-bg-1: #0f0f12;
      --color-bg-2: #18181b;
      --color-bg-3: #1e1e23;
      --color-bg-4: #27272a;
      --color-bg-5: #303036;
      --color-text-0: #fafafa;
      --color-text-1: #a1a1aa;
      --color-text-2: #71717a;
      --color-text-3: #52525b;
      --color-green: #22c55e;
      --color-green-dim: #16a34a;
      --color-border-default: #2a2a2f;
      --color-border-subtle: #1f1f24;

      --font-sans: "DM Sans", -apple-system, system-ui, sans-serif;

    body {
      margin: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: "DM Sans", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

    h1, h2, h3, h4, h5, h6 {

    }

    .faq-content {
      transition: max-height 0.2s ease, padding-bottom 0.2s ease;

  <noscript><style>[data-sb-menu-toggle]{display:none!important}

<body>

  <nav id="nav-1" class="px-6 md:px-10 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-green/10 flex items-center justify-center"><div class="w-4 h-4 rounded-full bg-green"></div></div>
      <span class="font-semibold text-[15px] text-text-0 tracking-tight">Acme</span>
    </div>
    <div class="hidden lg:flex items-center gap-6">
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Product</span>
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Features</span>

    <div class="flex items-center gap-3">

      <button type="button" data-sb-menu-toggle aria-label="Toggle menu" aria-expanded="false" aria-controls="sb_menu_1" class="lg:hidden w-9 h-9 rounded-lg border border-border-default flex items-center justify-center text-text-2 hover:text-text-0 hover:bg-bg-3 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>
  </nav>
  <div id="sb_menu_1" data-sb-menu-panel hidden class="lg:hidden px-6 md:px-10 pb-4">
    <div class="flex flex-col gap-3 [&>a]:py-2 [&>a]:leading-6">
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Product</span>
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Features</span>
    </div>
  </div>

    <script data-sb-runtime>(function(d,w){

}

}
d.addEventListener('click',function(e){

function tabsOf(t){var l=t.closest('[data-sb-tablist]');
return l?l.querySelectorAll('[data-sb-tab]'):[]}

function slidesOf(c){return c?c.querySelectorAll('[data-sb-carousel-slide]'):[]}function shown(s){var i;for(i=0;i<s.length;i++)if(!s[i].hidden)return i;return 0}

d.addEventListener('click',function(e){var t=e.target,b=t&&t.closest&&t.closest('[data-sb-carousel-prev],[data-sb-carousel-next]'),c;if(!b)return;c=b.closest('[data-sb-carousel]');if(!c)return;showSlide(c,shown(slidesOf(c))+(b.hasAttribute('data-sb-carousel-next')?1:-1),b)});
d.addEventListener('keydown',function(e){var k=e.key,t=e.target,c;if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||(k!=='ArrowLeft'&&k!=='ArrowRight'))return;c=t&&t.closest&&t.closest('[data-sb-carousel]');if(!c)return;var s=slidesOf(c),to=shown(s)+(k==='ArrowRight'?1:-1);if(to<0||to>s.length-1)return;e.preventDefault();showSlide(c,to,t.closest('[data-sb-carousel-prev],[data-sb-carousel-next]'))});
