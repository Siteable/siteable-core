<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corpus Four</title>
  <meta property="og:title" content="Corpus Four" />


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" />

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-0': '#09090b',
            'bg-1': '#0f0f12',
            'bg-2': '#18181b',
            'bg-3': '#1e1e23',
            'bg-4': '#27272a',
            'bg-5': '#303036',
            'text-0': '#fafafa',
            'text-1': '#a1a1aa',
            'text-2': '#71717a',
            'text-3': '#52525b',
            'green': {
              DEFAULT: '#22c55e',
              dim: '#16a34a',
            },
            'border-default': '#2a2a2f',
            'border-subtle': '#1f1f24',
            'border-hover': '#3a3a3f',
          },
          fontFamily: {
            sans: ['"DM Sans"', '-apple-system', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          borderRadius: {
            DEFAULT: '8px',
            lg: '12px',
          },
        },
      },
    }
  </script>

  <!-- Theme CSS Custom Properties -->
  <style>
    :root {
      --color-bg-0: #09090b;
      --color-bg-1: #0f0f12;
      --color-bg-2: #18181b;
      --color-bg-3: #1e1e23;
      --color-bg-4: #27272a;
      --color-bg-5: #303036;
      --color-text-0: #fafafa;
      --color-text-1: #a1a1aa;
      --color-text-2: #71717a;
      --color-text-3: #52525b;
      --color-green: #22c55e;
      --color-green-dim: #16a34a;
      --color-border-default: #2a2a2f;
      --color-border-subtle: #1f1f24;
      --color-border-hover: #3a3a3f;
      --font-sans: "DM Sans", -apple-system, system-ui, sans-serif;
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius-default: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: "DM Sans", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: "Space Grotesk", system-ui, sans-serif;
    }

    .faq-content {
      transition: max-height 0.2s ease, padding-bottom 0.2s ease;
    }

    .faq-chevron {
      transition: transform 0.2s ease;
    }
  </style>


</head>
<body>

  <section id="h-1" class="px-6 md:px-10 py-20 md:py-28 text-center">

      <h1 class="text-4xl md:text-5xl font-bold tracking-tight leading-[1.1] mb-4 max-w-3xl mx-auto">Home page</h1>
      <p class="text-text-2 text-base md:text-lg leading-relaxed max-w-xl mx-auto mb-8">Wrapped</p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <a href="https://example.com/start" class="px-6 py-3 rounded-lg bg-green text-black text-sm font-semibold hover:bg-green-dim transition-all inline-flex items-center gap-2">Start</a>

      </div>
  </section>

  <section id="f-1" class="px-6 md:px-10 py-16 md:py-20">
      <div class="text-center mb-10">

        <h2 class="text-2xl md:text-3xl font-bold tracking-tight mb-2">Listed</h2>

      </div>
      <div class="max-w-2xl mx-auto space-y-4">
        <div class="flex gap-4 p-4 rounded-xl bg-bg-2 border border-border-default transition-all hover:border-border-hover">
          <div class="w-10 h-10 rounded-lg bg-green/10 border border-green/20 flex items-center justify-center text-green shrink-0">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/><text x="9" y="13" text-anchor="middle" fill="currentColor" font-size="10" font-weight="600" font-family="system-ui, sans-serif">A</text></svg>
          </div>
          <div>
            <h3 class="text-sm font-semibold mb-0.5">Alpha</h3>
            <p class="text-[12.5px] text-text-2 leading-relaxed">First</p>
          </div>
        </div>
      </div>
  </section>

  <footer id="ft-1" class="px-6 md:px-10 py-8 border-t border-border-subtle">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-md bg-green/10 flex items-center justify-center"><div class="w-3 h-3 rounded-full bg-green"></div></div>
          <span class="text-sm font-semibold text-text-1">Acme</span>
        </div>
        <div class="flex items-center gap-4">

        </div>
        <span class="text-[11px] text-text-3">(c) 2026 Acme</span>
      </div>
  </footer>

</body>
</html>
