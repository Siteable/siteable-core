<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site</title>
  <meta property="og:title" content="Site" />


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" />

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-0': '#09090b',
            'bg-1': '#0f0f12',
            'bg-2': '#18181b',
            'bg-3': '#1e1e23',
            'bg-4': '#27272a',
            'bg-5': '#303036',
            'text-0': '#fafafa',
            'text-1': '#a1a1aa',
            'text-2': '#71717a',
            'text-3': '#52525b',
            'green': {
              DEFAULT: '#22c55e',
              dim: '#16a34a',
            },
            'border-default': '#2a2a2f',
            'border-subtle': '#1f1f24',
            'border-hover': '#3a3a3f',
          },
          fontFamily: {
            sans: ['"DM Sans"', '-apple-system', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          borderRadius: {
            DEFAULT: '8px',
            lg: '12px',
          },
        },
      },
    }
  </script>

  <!-- Theme CSS Custom Properties -->
  <style>
    :root {
      --color-bg-0: #09090b;
      --color-bg-1: #0f0f12;
      --color-bg-2: #18181b;
      --color-bg-3: #1e1e23;
      --color-bg-4: #27272a;
      --color-bg-5: #303036;
      --color-text-0: #fafafa;
      --color-text-1: #a1a1aa;
      --color-text-2: #71717a;
      --color-text-3: #52525b;
      --color-green: #22c55e;
      --color-green-dim: #16a34a;
      --color-border-default: #2a2a2f;
      --color-border-subtle: #1f1f24;
      --color-border-hover: #3a3a3f;
      --font-sans: "DM Sans", -apple-system, system-ui, sans-serif;
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius-default: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: "DM Sans", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: "Space Grotesk", system-ui, sans-serif;
    }

    .faq-content {
      transition: max-height 0.2s ease, padding-bottom 0.2s ease;
    }

    .faq-chevron {
      transition: transform 0.2s ease;
    }
  </style>


  <noscript><style>[data-sb-menu-toggle]{display:none!important}
@media (max-width:1023.98px){[data-sb-menu-panel]{display:block!important}}
.faq-content{max-height:none!important;padding-bottom:1rem!important}
.faq-chevron{display:none!important}</style></noscript>
</head>
<body>

  <nav id="nav-1" class="px-6 md:px-10 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-green/10 flex items-center justify-center"><div class="w-4 h-4 rounded-full bg-green"></div></div>
      <span class="font-semibold text-[15px] text-text-0 tracking-tight">Acme</span>
    </div>
    <div class="hidden lg:flex items-center gap-6">
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Product</span>
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Features</span>
    </div>
    <div class="flex items-center gap-3">
      <button class="px-4 py-2 rounded-lg bg-green text-black text-[13px] font-semibold hover:bg-green-dim transition-colors">Get Started</button>
      <button type="button" data-sb-menu-toggle aria-label="Toggle menu" aria-expanded="false" aria-controls="sb_menu_1" class="lg:hidden w-9 h-9 rounded-lg border border-border-default flex items-center justify-center text-text-2 hover:text-text-0 hover:bg-bg-3 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>
  </nav>
  <div id="sb_menu_1" data-sb-menu-panel hidden class="lg:hidden px-6 md:px-10 pb-4">
    <div class="flex flex-col gap-3 [&>a]:py-2 [&>a]:leading-6">
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Product</span>
          <span class="text-[13px] text-text-2 hover:text-text-0 transition-colors cursor-pointer">Features</span>
    </div>
  </div>

  <section id="q-1" class="px-6 md:px-10 py-16 md:py-20">
      <div class="text-center mb-10">
        <h2 class="text-2xl md:text-3xl font-bold tracking-tight mb-2">FAQ</h2>

      </div>
      <div class="max-w-2xl mx-auto">
        <div class="border-b border-border-subtle">
          <button class="w-full flex items-center justify-between py-4 text-left group" aria-expanded="true">
            <span class="text-[13.5px] font-medium text-text-0 group-hover:text-green transition-colors">What is this?</span>
            <span class="faq-chevron text-text-3 shrink-0 ml-4 transition-transform duration-200 rotate-180 text-green"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </button>
          <div class="faq-content overflow-hidden transition-all duration-200 max-h-[500px] pb-4">
            <p class="text-[12.5px] text-text-2 leading-relaxed pr-8">A tab page with a runtime</p>
          </div>
        </div>
      </div>
  </section>

  <section id="f-1" class="px-6 md:px-10 py-16 md:py-20">
      <div class="text-center mb-10">

        <h2 class="text-2xl md:text-3xl font-bold tracking-tight mb-2">Tabs</h2>

      </div>
      <div class="max-w-2xl mx-auto space-y-4">
        <div class="flex gap-4 p-4 rounded-xl bg-bg-2 border border-border-default transition-all hover:border-border-hover">
          <div class="w-10 h-10 rounded-lg bg-green/10 border border-green/20 flex items-center justify-center text-green shrink-0">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/><text x="9" y="13" text-anchor="middle" fill="currentColor" font-size="10" font-weight="600" font-family="system-ui, sans-serif">A</text></svg>
          </div>
          <div>
            <h3 class="text-sm font-semibold mb-0.5">First feature</h3>
            <p class="text-[12.5px] text-text-2 leading-relaxed">The first baseline feature</p>
          </div>
        </div>
        <div class="flex gap-4 p-4 rounded-xl bg-bg-2 border border-border-default transition-all hover:border-border-hover">
          <div class="w-10 h-10 rounded-lg bg-green/10 border border-green/20 flex items-center justify-center text-green shrink-0">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/><text x="9" y="13" text-anchor="middle" fill="currentColor" font-size="10" font-weight="600" font-family="system-ui, sans-serif">B</text></svg>
          </div>
          <div>
            <h3 class="text-sm font-semibold mb-0.5">Second feature</h3>
            <p class="text-[12.5px] text-text-2 leading-relaxed">The second baseline feature</p>
          </div>
        </div>
      </div>
  </section>

    <script data-sb-runtime>(function(d,w){
function rm(){return !!(w.matchMedia&&w.matchMedia('(prefers-reduced-motion: reduce)').matches)}
function panelOf(b){return d.getElementById(b.getAttribute('aria-controls')||'')}
function setMenu(b,open){var p=panelOf(b);if(!p)return;
b.setAttribute('aria-expanded',open?'true':'false');p.hidden=!open}
function faq(btn){
var content=btn.nextElementSibling,chevron=btn.querySelector('.faq-chevron');
var isOpen=btn.getAttribute('aria-expanded')==='true';
var section=btn.closest('section');
var items=section?section.querySelectorAll('[aria-expanded]'):[];
for(var i=0;i<items.length;i++){
var b=items[i],n=b.nextElementSibling,c=b.querySelector('.faq-chevron');
b.setAttribute('aria-expanded','false');
if(n){n.style.maxHeight='0';n.style.paddingBottom='0';if(rm())n.style.transition='none'}
if(c){c.style.transform='';c.classList.remove('text-green');
c.classList.remove('rotate-180');c.classList.add('text-text-3');
if(rm())c.style.transition='none'}
}
if(!isOpen){
btn.setAttribute('aria-expanded','true');
if(content){content.style.maxHeight='500px';content.style.paddingBottom='1rem';
if(rm())content.style.transition='none'}
if(chevron){chevron.style.transform='rotate(180deg)';chevron.classList.add('text-green');
chevron.classList.remove('text-text-3');if(rm())chevron.style.transition='none'}
}
}
d.addEventListener('click',function(e){
var t=e.target;if(!t||!t.closest)return;
var b=t.closest('[data-sb-menu-toggle]');
if(b){setMenu(b,b.getAttribute('aria-expanded')!=='true');return}
b=t.closest('button');var n=b&&b.nextElementSibling;
if(n&&n.classList.contains('faq-content'))faq(b);
});
d.addEventListener('keydown',function(e){
if(e.key!=='Escape')return;
var list=d.querySelectorAll('[data-sb-menu-toggle][aria-expanded="true"]');
if(!list.length)return;
var active=d.activeElement,focus=null,i,p;
for(i=0;i<list.length;i++){
p=panelOf(list[i]);
if(active&&(list[i]===active||(p&&p.contains(active))))focus=list[i];
}
if(focus){setMenu(focus,false);focus.focus();return}
// The editor only receives Escape from inside its own nav, so it never
// reaches this close-all fallback. It is a superset, not a divergence.
for(i=0;i<list.length;i++)setMenu(list[i],false);
list[0].focus();
});
})(document,window);</script>
</body>
</html>
