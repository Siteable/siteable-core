name: CI

# PR-triggered quality gate (GitHub Flow). Additive only — the tag-triggered
# publish.yml flow is untouched. Job names here double as required-status-check
# names in branch protection: renaming a job silently orphans the requirement
# and can soft-lock merges — re-check Settings > Branches if these ever change.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches publish.yml

      - run: npm ci

      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npm run build

  # Shared scanner convention across all 3 repos (A01/A02/A03): gitleaks
  # pinned to the SAME version static-cms uses (GITLEAKS_VERSION in
  # static-cms/.gitlab-ci.yml — 8.21.2), same checksum-verified install,
  # same scan commands, repo-root .gitleaks.toml (extends default rules).
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the --log-opts=--all scan

      - name: Install gitleaks 8.21.2 (SHA256 checksum verified)
        run: |
          cd /tmp
          curl -sL -O "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_checksums.txt" | grep 'linux_x64.tar.gz' > checksums.txt
          sha256sum -c checksums.txt
          tar xzf gitleaks_8.21.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml

      - name: Scan full git history
        run: gitleaks git . --log-opts=--all --config .gitleaks.toml
